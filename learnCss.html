<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <style>
        body{
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            font-family: sans-serif;
        }
        .card
        {
            padding: 40px 60px;
            color: #fff;
            font-size: 1.2rem;
            
            background-color: rgba(255,255,255,0.20);
            backdrop-filter: blur(10px);
            saturate(180%); -webkit-backdrop-filter: blur(10px) saturation(180%);
            border: 1px solid rgba(255,255,255,0.30);
            border-radius: 16px;
            box-shadow: 0px 8px 32px rgba(0,0,0,0.25);
        }
        .pad
        {
            padding: 50px;
            background-color: green;
        }
    </style>
</head>
<body>
   <div class=" w3-text-black w3-green w3-hover-text-yellow w3-hover-purple w3-center">
    This is external css.
   </div><br>
   <div class=" w3-text-black w3-pink w3-hover-text-yellow w3-hover-green w3-right">
    This is internal css.
   </div><br><br>
   <div class="w3-card w3-red">
    This is a card
   </div><br>
   <div class="card">
    This is a second css.
   </div><br>
   <div class="pad">
    Checking padding and margin.
   </div>
</body>
</html>
